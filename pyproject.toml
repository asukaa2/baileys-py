[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baileys-py"
version = "0.1.0"
description = "A simple, Pythonic re-implementation of the Baileys WhatsApp Web API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "baileys-py contributors" }]
keywords = ["whatsapp", "baileys", "wa", "bot", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "websockets>=11.0",
    "cryptography>=41.0",
    "qrcode>=7.4",
    "protobuf>=4.24",
    "pino>=0.1",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.urls]
Source = "https://github.com/whiskeysockets/Baileys"

[tool.setuptools.packages.find]
include = ["baileys_py*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
